# Firm watchlist: Michigan-based or Michigan-active dealmakers.
#
# Used to (1) classify buyers as financial sponsors / family offices / strategics,
# (2) recognize advisors in filings and press releases, and (3) flag wire and news items
# that mention these firms (most firms announce deals through PR Newswire, Business Wire
# or GlobeNewswire, which the pipeline already monitors).
#
# Optional per-firm keys:
#   aliases:   other names the firm appears under
#   rss_url:   a public RSS feed for the firm's news (checked daily, robots.txt respected)
#   news_url:  a public news/portfolio page (checked daily for new deal links, robots.txt respected)
# Leave rss_url/news_url blank until you have confirmed the URL and that the site allows it.

