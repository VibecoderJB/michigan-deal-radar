name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", "data/**", "pipeline/reporting/**", "scripts/build_site.sh", ".github/workflows/deploy.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # pick up the data commit made earlier in the same run
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Assemble site
        run: ./scripts/build_site.sh
      - name: Build PDF reports and Excel workbook
        run: python -m pipeline.reporting.build --out _site/reports # uses the runner's preinstalled Chrome
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
